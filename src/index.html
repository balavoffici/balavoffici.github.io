  <!-- Before first paint: theme, `js` flag for scroll reveals, and opening titles once per visit -->
  <script>
    (function () {
      var root = document.documentElement;
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function saved() {
        try { return localStorage.getItem('theme'); } catch (e) { return null; }
      }
      var theme = saved();
      root.setAttribute('data-theme', theme === 'light' || theme === 'dark' ? theme : media.matches ? 'dark' : 'light');
      media.addEventListener('change', function (e) {
        if (!saved()) root.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      });

      root.classList.add('js');
      try {
        if (sessionStorage.getItem('intro')) root.setAttribute('data-intro', 'seen');
        sessionStorage.setItem('intro', '1');
      } catch (e) {}
    })();
  </script>
