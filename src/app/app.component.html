<!-- Opening titles: pure CSS, so they clear on their own even before/without JS -->
<div class="intro" aria-hidden="true" (click)="skipIntro($event)">
  <div class="curtain curtain-top"></div>
  <div class="curtain curtain-bottom"></div>
  <div class="titles">
    <p class="kicker">Portfolio</p>
    <p class="intro-name">
      @for (letter of introLetters; track $index) {
        <span [style.--i]="$index">{{ letter }}</span>
      }
    </p>
    <div class="loader">
      <span class="loader-line"></span>
      <span class="count"></span>
    </div>
  </div>
</div>

<div class="progress" #progress aria-hidden="true"></div>

<a class="skip-link" href="#main">Skip to content</a>

<app-header />

<main id="main">
  <app-hero />
  <app-about />
  <app-experience />
  <app-projects />
  <app-skills />
  <app-education />
  <app-contact />
</main>

<footer class="footer">
  <div class="container footer-inner">
    <p>© {{ year }} {{ profile.name }}. Built with Angular.</p>
    <a href="#home" class="to-top" (click)="toTop($event)">
      Back to top
      <app-icon name="arrow-up" />
    </a>
  </div>
</footer>

@defer (on idle) {
  <app-cursor />
}
